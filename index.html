<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Libreta de Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
/* Layout: una columna tipo libreta de entrenamiento, barra de pestañas abajo, timer de descanso fijo sobre ella. Tema oscuro único (se usa en el gym). */
:root{
  --bg:#121417; --surface:#1A1E23; --surface2:#222830; --line:#2D343D;
  --fg:#ECEEF0; --muted:#8C96A1; --accent:#FF8A3D; --accent-ink:#1A0F06;
  --good:#4CC38A; --far:#6E7782; --prop:#4A5360; --warn:#F2C14E; --bad:#F06A6A;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 150px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;text-transform:uppercase}
h1{font-size:34px;line-height:1}
h2{font-size:24px;line-height:1.05}
h3{font-size:20px;line-height:1.1}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:700;font-size:16px;background:var(--surface2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.full{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* top */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:8px 16px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)}.dot.err{background:var(--bad)}

/* hero day */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero h2{font-size:40px;line-height:.95}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exlist li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.exlist li:first-child{border-top:0}
.exlist .sx{color:var(--muted);white-space:nowrap}
.daycard{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.daycard:last-child{border-bottom:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:10px 0}
.stat b{display:block;font-family:var(--f-display);font-size:28px;line-height:1}
.stat span{font-size:12px;color:var(--muted)}

/* workout */
.wbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.excard.complete{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.exhead{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%}
.exhead .info{font-size:13px;color:var(--muted);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.chip.up{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.chip.hold{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.chip.new{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:8px;align-items:center}
.sets .h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sets .idx{font-family:var(--f-display);font-size:20px;color:var(--muted);text-align:center}
.sets input{width:100%;min-width:0;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:600 20px/1 var(--f-body);text-align:center;font-variant-numeric:tabular-nums}
.sets input::placeholder{color:color-mix(in srgb,var(--muted) 60%,transparent)}
.check{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;justify-content:center}
.check svg{width:22px;height:22px;stroke:var(--muted)}
.check.on{background:var(--good);border-color:var(--good)}
.check.on svg{stroke:#0B2418}
.sets .done input{border-color:color-mix(in srgb,var(--good) 50%,var(--line));color:var(--good)}
.prev{grid-column:2 / 4;font-size:12px;color:var(--muted);margin-top:-4px;text-align:center}

/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:20;padding:0 12px 8px}
.rest .in{max-width:536px;margin:0 auto;background:var(--surface2);border:1px solid var(--accent);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.rest .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width 1s linear}
.rest .t{font-family:var(--f-display);font-size:36px;line-height:1;font-variant-numeric:tabular-nums;min-width:84px}
.rest.over .in{border-color:var(--good)}
.rest.over .t{color:var(--good)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button.on{color:var(--fg)}
.tabs button.on svg{stroke:var(--accent)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.55)}
.sheet .panel{background:var(--bg);border-top:1px solid var(--line);border-radius:20px 20px 0 0;max-height:92%;overflow:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.steps li::marker{font-family:var(--f-display);color:var(--accent);font-weight:700}
.warnlist{margin:0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.chart{width:100%;height:auto;display:block}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.section{display:flex;flex-direction:column;gap:10px;padding-block:14px;border-top:1px solid var(--line)}

/* history */
.sess{border-top:1px solid var(--line);padding-block:12px}
.sess summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.sess summary::-webkit-details-marker{display:none}
.sess table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.sess td{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}
.sess td:last-child{text-align:right;color:var(--muted)}

/* plan editor */
.pday{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pname{width:100%;min-width:0;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--fg);font:700 24px/1.1 var(--f-display);text-transform:uppercase;padding:4px 0}
.pex{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.pex .nm{min-width:0}
.pex .ctl{display:flex;gap:4px}
.pex .nums{grid-column:1 / -1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pex .nums input{width:52px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);text-align:center;font:600 16px var(--f-body)}
.icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface2)}
.icon svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.pick{display:flex;flex-direction:column}
.pick button{display:flex;justify-content:space-between;text-align:left;padding:12px 0;border-top:1px solid var(--line);gap:12px}
.confirm{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--surface2);border:1px solid var(--good);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px)}
.note{font-size:13px;color:var(--muted)}
.fig{display:block;width:100%;height:auto}
.thumb{width:76px;aspect-ratio:1;flex:none;background:var(--surface2);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.sm{width:56px}
.photo{position:relative;border-radius:14px;overflow:hidden;background:var(--surface2);aspect-ratio:3/2;max-width:100%;margin-top:12px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.photo .lbl{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:6px}
.photo .hint{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:4px 8px;border-radius:6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pair button{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:3/2;border:2px solid transparent;padding:0}
.pair button.on{border-color:var(--accent)}
.pair img{width:100%;height:100%;object-fit:cover;display:block}
.pair span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px}
.figbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 6px 2px;margin-top:12px}
.figframes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.figcap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:2px 6px 6px}
.plans{display:grid;gap:10px}
.plan{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.plan.on{border-color:var(--accent)}
.plan .d{font-family:var(--f-display);font-size:13px;letter-spacing:.1em;color:var(--accent);font-weight:700}
.exlist .sg{font-size:13px;margin-top:2px}
.sg.est,.chip.est{color:var(--accent)}
.chip.est{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.hero.live{border-color:var(--accent)}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.goal{text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.goal b{font-family:var(--f-display);font-size:19px;text-transform:uppercase;letter-spacing:.02em}
.goal span{font-size:12px;color:var(--muted);line-height:1.35}
.goal.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface2))}
.backbtn{padding-left:8px;gap:4px}
.backbtn svg,.wbar .icon svg{width:18px;height:18px;stroke:var(--fg);fill:none;stroke-width:2.2}
.rot{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.rot b{font-family:var(--f-display);color:var(--muted);margin-right:2px}
.rot .on{color:var(--fg)}.rot .on b{color:var(--accent)}
.cweek{display:grid;grid-template-columns:30px 1fr 52px auto 52px 38px;gap:6px;align-items:center}
.cweek.on .cn{color:var(--accent)}
.cweek .cn{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--muted)}
.cweek input{width:100%;min-width:0;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);text-align:center;font:600 16px var(--f-body)}
.cweek input.ctext{text-align:left;padding:0 8px}
.sg.up{color:var(--good)}.sg.hold{color:var(--warn)}.sg.same{color:var(--fg)}.sg.new{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="wrap" id="app"></div>

<nav class="tabs" id="tabs"></nav>

<script>
// ---------- Figuras de ejercicios (SVG, vista lateral mirando a la derecha) ----------
const SEG={torso:34,neck:5,head:7,ua:19,fa:17,th:26,sh:25,ft:9};
const R=a=>a*Math.PI/180;
const V=(a,l)=>[Math.cos(R(a))*l,Math.sin(R(a))*l];
const ADD=(P,Q)=>[P[0]+Q[0],P[1]+Q[1]];
function ikSolve(H,T,a,b,bend){
  const dx=T[0]-H[0],dy=T[1]-H[1];let d=Math.hypot(dx,dy);d=Math.min(d,a+b-0.01);d=Math.max(d,Math.abs(a-b)+0.01);
  const base=Math.atan2(dy,dx),al=Math.acos((a*a+d*d-b*b)/(2*a*d));
  const ang=base+bend*al;const K=[H[0]+Math.cos(ang)*a,H[1]+Math.sin(ang)*a];
  const sa=Math.atan2(T[1]-K[1],T[0]-K[0]);return [K,[K[0]+Math.cos(sa)*b,K[1]+Math.sin(sa)*b]];
}

  remo_barra:{anc:["ank",98,136],load:["wri","bar"],a:{t:-40,ua:90,fa:90,th:72,sh:100},b:{t:-40,ua:205,fa:95,th:72,sh:100}},
  jalon:{anc:["hip",86,104],load:["wri","cable",[112,4]],props:[["l",66,110,104,110,6],["l",84,110,84,140,4],["l",116,92,116,140,4]],
    a:{t:-100,ua:-78,fa:-82,th:2,sh:95},b:{t:-102,ua:112,fa:-62,th:2,sh:95}},

  remo_manc:{anc:["hip",72,90],load:["wri","db"],props:[["l",36,124,118,124,6],["l",44,124,44,140,4],["l",110,124,110,140,4]],

    a:{t:-90,ua:105,fa:-82,th:0,sh:90},b:{t:-90,ua:-84,fa:-92,th:0,sh:90}},
  elev_lat:{front:true,load:"db",a:{abd:12,elb:8},b:{abd:88,elb:8}},

  curl_martillo:{anc:["ank",98,136],load:["wri","db"],a:{t:-90,ua:92,fa:88,th:90,sh:90},b:{t:-90,ua:88,fa:-68,th:90,sh:90}},

  press_frances:{anc:["hip",70,104],load:["wri","bar"],props:[["l",52,112,138,112,6],["l",62,112,62,140,4],["l",128,112,128,140,4]],
    a:{t:0,ua:-76,fa:-90,th:160,sh:90},b:{t:0,ua:-76,fa:22,th:160,sh:90}},

function figJoints(spec,p){
  const J={hip:[0,0]};
  J.sho=ADD(J.hip,V(p.t,SEG.torso));J.head=ADD(J.sho,V(p.t,SEG.neck+SEG.head));
  J.elb=ADD(J.sho,V(p.ua,SEG.ua));J.wri=ADD(J.elb,V(p.fa,SEG.fa));
  if(p.ua2!=null){J.elb2=ADD(J.sho,V(p.ua2,SEG.ua));J.wri2=ADD(J.elb2,V(p.fa2,SEG.fa))}
  if(p.th!=null){J.kne=ADD(J.hip,V(p.th,SEG.th));J.ank=ADD(J.kne,V(p.sh,SEG.sh));J.toe=ADD(J.ank,V(p.ft??0,SEG.ft))}
  if(p.th2!=null){J.kne2=ADD(J.hip,V(p.th2,SEG.th));J.ank2=ADD(J.kne2,V(p.sh2,SEG.sh));J.toe2=ADD(J.ank2,V(p.ft2??0,SEG.ft))}
  const [aj,ax,ay]=spec.anc;const o=[ax-J[aj][0],ay-J[aj][1]];
  for(const k in J)J[k]=ADD(J[k],o);
  if(spec.ik){const [K,A]=ikSolve(J.hip,spec.ik,SEG.th,SEG.sh,spec.ik[2]);J.kne=K;J.ank=A;J.toe=ADD(A,V(p.ft??0,SEG.ft))}
  if(spec.ik2){const [K,A]=ikSolve(J.hip,spec.ik2,SEG.th,SEG.sh,spec.ik2[2]);J.kne2=K;J.ank2=A;J.toe2=ADD(A,V(p.ft2??0,SEG.ft))}
  else if(!J.kne2&&J.kne){J.kne2=J.kne;J.ank2=J.ank;J.toe2=J.toe}
  if(!J.elb2){J.elb2=J.elb;J.wri2=J.wri}
  return J;
}
function lerpPose(a,b,k){const o={};for(const key of new Set([...Object.keys(a),...Object.keys(b)])){const x=a[key]??b[key],y=b[key]??a[key];o[key]=x+(y-x)*k}return o}
const F=n=>n.toFixed(1);
const ln=(P,Q,w,c)=>`<line x1="${F(P[0])}" y1="${F(P[1])}" x2="${F(Q[0])}" y2="${F(Q[1])}" style="stroke:${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const ci=(P,r,c)=>`<circle cx="${F(P[0])}" cy="${F(P[1])}" r="${r}" style="fill:${c}"/>`;
function drawLoad(type,P,C,dir){
  if(type==="bar")return ci(P,12,C.load)+ci(P,3,C.bg);
  if(type==="db")return ci(P,6,C.load);
  if(type==="pad")return ci(P,6,C.load);
  if(type==="sled"){const a=R(-38+90),d=[Math.cos(a)*16,Math.sin(a)*16];return ln([P[0]+4-d[0],P[1]-2-d[1]],[P[0]+4+d[0],P[1]-2+d[1]],7,C.load)}
  return "";
}
function figSVG(id,k,C,size){
  const spec=FIG[id];if(!spec)return "";
  const W=200,H=148;let s="";
  if(spec.floor!==false)s+=ln([8,141],[192,141],2,C.prop);
  if(spec.front){
    const p=lerpPose(spec.a,spec.b,k),cx=100,sy=56;
    if(spec.pulleys){s+=ln([20,10],[20,141],4,C.prop)+ln([180,10],[180,141],4,C.prop)}
    const arm=side=>{const S=[cx+side*13,sy];const d=side>0?90-p.abd:90+p.abd;const E=ADD(S,V(d,SEG.ua));const d2=side>0?d-p.elb:d+p.elb;const Wr=ADD(E,V(d2,SEG.fa));return [S,E,Wr]};
    const L=arm(-1),Rr=arm(1);
    s+=ln([cx-8,sy+34],[cx-12,140],7,C.fig)+ln([cx+8,sy+34],[cx+12,140],7,C.fig);
    s+=ln([cx,sy-2],[cx,sy+32],12,C.fig)+ln([cx-13,sy],[cx+13,sy],8,C.fig)+ln([cx-8,sy+32],[cx+8,sy+32],8,C.fig);
    s+=ci([cx,sy-15],SEG.head,C.fig);
    for(const A of [L,Rr]){if(spec.load==="cable")s+=ln(A[2],[A===L?20:180,14],1.5,C.load);s+=ln(A[0],A[1],7,C.fig)+ln(A[1],A[2],6,C.fig);if(spec.load==="db")s+=ci(A[2],6,C.load)}
  }else{
    for(const pr of spec.props||[])if(pr[0]==="l")s+=ln([pr[1],pr[2]],[pr[3],pr[4]],pr[5],C.prop);
    const p=lerpPose(spec.a,spec.b,k);const J=figJoints(spec,p);
    const ld=spec.load;let LP=null;
    if(ld){LP=J[ld[0]];if(ld[0]==="sho"&&ld[2]!=null)LP=ADD(LP,[ld[2],ld[3]]);if(ld[1]==="cable")s+=ln(ld[2],LP,1.5,C.load)}
    // lado lejano
    s+=ln(J.hip,J.kne2,7,C.far)+ln(J.kne2,J.ank2,6,C.far)+ln(J.ank2,J.toe2,5,C.far);
    s+=ln(J.sho,J.elb2,6,C.far)+ln(J.elb2,J.wri2,5,C.far);
    // cuerpo
    s+=ln(J.hip,J.sho,11,C.fig);
    s+=ci(J.head,SEG.head,C.fig);
    s+=ln(J.hip,J.kne,8,C.fig)+ln(J.kne,J.ank,7,C.fig)+ln(J.ank,J.toe,5,C.fig);
    if(ld&&ld[1]==="bar"&&ld[0]!=="wri"&&ld[0]!=="hip")s+=drawLoad("bar",LP,C);
    s+=ln(J.sho,J.elb,7,C.fig)+ln(J.elb,J.wri,6,C.fig);
    if(ld&&ld[1]!=="cable"&&!(ld[1]==="bar"&&ld[0]!=="wri"&&ld[0]!=="hip"))s+=drawLoad(ld[1],LP,C);
    if(ld&&ld[1]==="cable")s+=ci(LP,3.5,C.load);
  }
  return size==="raw"?s:`<svg viewBox="0 0 ${W} ${H}" class="fig" role="img" aria-label="Ilustración del ejercicio">${s}</svg>`;
}

const MAIN=new Set(["press_banca","sentadilla","peso_muerto","press_militar","remo_barra","dominadas"]);
const COMP2=new Set(["peso_muerto_rumano","press_incl_manc","prensa","hip_thrust","zancada_bulgara","fondos","jalon","remo_polea","remo_manc","press_hombro_manc","goblet","zancadas"]);
const CARDIO=["cinta","bici","remo_ergo","eliptica"];
const TONO_SUB={sentadilla:"goblet",peso_muerto:"peso_muerto_rumano",press_militar:"press_hombro_manc",remo_barra:"remo_manc",fondos:"flexiones",dominadas:"jalon",zancada_bulgara:"zancadas"};
function applyGoal(exs,goal,di){
  const base=exs.map(e=>({...e}));
  if(goal==="fuerza")return base.slice(0,5).map(e=>MAIN.has(e.id)?{...e,sets:5,lo:3,hi:5,rest:180}:COMP2.has(e.id)?{...e,sets:3,lo:6,hi:8,rest:120}:{...e,sets:3,lo:8,hi:10,rest:90});
  if(goal==="grasa"){
    const st=base.slice(0,4).map(e=>(MAIN.has(e.id)||COMP2.has(e.id))?{...e,sets:3,lo:8,hi:12,rest:75}:{...e,sets:3,lo:12,hi:15,rest:60});
    const meta=di%2?{id:"escaladores",sets:3,lo:30,hi:45,rest:30}:{id:"kb_swing",sets:3,lo:15,hi:20,rest:45};
    return [...st,meta,{id:CARDIO[di%CARDIO.length],sets:1,lo:20,hi:30,rest:0}];
  }
  if(goal==="tono"){
    const seen=new Set(base.map(e=>e.id));
    const st=base.slice(0,5).map(e=>{const sub=TONO_SUB[e.id];const id=sub&&!seen.has(sub)?sub:e.id;seen.add(id);return {...e,id,sets:3,lo:12,hi:15,rest:60}});
    return [...st,{id:"plancha",sets:3,lo:30,hi:60,rest:45},{id:CARDIO[(di+1)%CARDIO.length],sets:1,lo:10,hi:15,rest:0}];
  }
  return base;
}
function buildPlan(key,goal){const g=goal||"musculo";const p=PLANS.find(p=>p.key===key)||PLANS[2];return {key:p.key,goal:g,name:p.name,days:p.days.map((k,i)=>({id:"d"+(i+1)+k,name:DAY[k][0],ex:applyGoal(mk(DAY[k][1]),g,i)}))}}
const DEFAULT_PLAN=(()=>{const p=buildPlan("tl4");delete p.goal;return p})();

function writer(fn){let running=false,pending,has=false;return async v=>{pending=v;has=true;if(running)return;running=true;while(has){const x=pending;has=false;try{await fn(x);setSync("ok")}catch(e){console.warn(e);await new Promise(r=>setTimeout(r,600+Math.random()*600));try{await fn(x);setSync("ok")}catch(e2){setSync("err")}}}running=false}}
const writePlan=writer(async p=>{lsSet("gym.plan",p)});
const writeDraft=writer(async d=>{lsSet("gym.draft",d)});
async function writeSession(s){lsSet("gym.sessions",state.sessions)}
async function removeSession(id){lsSet("gym.sessions",state.sessions)}
let draftTimer=null;
function saveDraftSoon(){clearTimeout(draftTimer);draftTimer=setTimeout(()=>writeDraft(state.draft),1200)}
function saveDraftNow(){clearTimeout(draftTimer);writeDraft(state.draft)}
function setSync(s){Store.status=s;const el=$("#sync");if(el)el.outerHTML=syncHTML()}
function syncHTML(){
  const s=lsOK()?["ok","Guardado en este iPhone"]:["err","No se puede guardar: salí del modo privado"];
  return `<div class="sync" id="sync"><span class="dot ${s[0]}"></span>${s[1]}</div>`;
}

// ---------- Estado ----------
const state={
  plan:lsGet("gym.plan")||clone(DEFAULT_PLAN),
  sessions:lsGet("gym.sessions")||[],
  draft:lsGet("gym.draft"),
  cycle:lsGet("gym.cycle"),
  vary:lsGet("gym.vary"),
  tab:"train", importData:null, sheet:null, confirmFinish:false, confirmDel:null, confirmPlan:null, confirmGoal:null, rest:null
};
state.inWorkout=!!state.draft;
// ---------- Ciclo semanal ----------
const CYCLE_PRESET=[{n:"Base",lo:10,hi:12},{n:"Volumen",lo:13,hi:15},{n:"Pesada",lo:4,hi:6},{n:"Liviana",lo:25,hi:30}];
function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function cycleWeek(){const c=state.cycle;if(!c||!c.on||!c.weeks||!c.weeks.length)return null;
  const w=Math.round(Math.round((mondayOf(new Date())-mondayOf(c.start))/864e5)/7);const L=c.weeks.length;const i=((w%L)+L)%L;
  return {i,total:L,...c.weeks[i],id:"c"+i}}
function saveCycle(){lsSet("gym.cycle",state.cycle)}
function saveVary(){lsSet("gym.vary",state.vary)}
function varyWeek(){const v=state.vary;if(!v||!v.on||!v.n)return null;
  const w=Math.round(Math.round((mondayOf(new Date())-mondayOf(v.start))/864e5)/7);const i=((w%v.n)+v.n)%v.n;return {i,n:v.n,letter:LETTERS[i]}}
// Ejercicios de un día para la semana de variante w (0 = tu rutina tal cual)
function resolveDay(day,w){
  const v=state.vary;if(w==null){const vw=varyWeek();w=vw?vw.i:0}
  if(!w)return day.ex.map(e=>({...e,base:e.id}));
  const used=new Set();
  return day.ex.map(e=>{
    let id=e.id;const g=VAR_OF[e.id];
    const fixed=v&&v.keepMain&&MAIN.has(e.id);
    if(g&&!fixed){for(let k=0;k<g.length;k++){const cand=g[(w+k)%g.length];if(!used.has(cand)&&!day.ex.some(o=>o!==e&&o.id===cand)){id=cand;break}}}
    used.add(id);
    return {...e,id,base:e.id}})}
function rx(e){const base=e.rest??LIB[e.id]?.rest??90;const cw=cycleWeek();
  if(cw&&isStd(e.id)){const rest=cw.hi<=6?Math.max(base,150):cw.lo>=20?Math.min(base,60):base;return {lo:cw.lo,hi:cw.hi,rest}}
  return {lo:e.lo,hi:e.hi,rest:base}}
const sortSessions=()=>state.sessions.sort((a,b)=>b.date.localeCompare(a.date));

// ---------- Progresión ----------
function lastFor(exId,phase){
  for(const s of state.sessions){if(phase&&s.cyc!==phase)continue;const e=s.entries.find(e=>e.id===exId);if(e&&e.sets.length)return {date:s.date,sets:e.sets}}
  return null;
}
function suggest(exId,n,lo,hi,phase){
  const lib=LIB[exId]||{inc:2.5};const std=isStd(exId);const [u0,u]=COLS(exId);const st=STEP(exId);
  let last=lastFor(exId,phase);
  const lastTxt=L=>L?(std?`Última: ${fmtKg(Math.max(...L.sets.map(x=>x.w)))} kg × ${L.sets.map(x=>x.r).join("·")} · `:`Última: ${L.sets.map(x=>x.r).join("·")} ${u} · `):"";
  if(!last&&phase&&std){const any=lastFor(exId);if(any){
    const e1=Math.max(...any.sets.map(s=>(s.w||0)*(1+s.r/30)));const inc=lib.inc||2.5;const w=Math.max(0,Math.floor(e1/(1+((lo+hi)/2)/30)/inc)*inc);
    return {kind:"est",w,reps:Array(n).fill(lo),text:`Semana nueva: probá ${fmtKg(w)} kg para ${lo}–${hi} reps (calculado con tus marcas)`,short:`hoy ~${fmtKg(w)} kg`,lastTxt:lastTxt(any),last:any}}}
  if(!last)return {kind:"new",w:"",reps:Array(n).fill(lo),text:std?`Primera vez: elegí un peso con el que llegues a ${hi} reps con buena técnica`:`Primera vez: apuntá a ${lo}–${hi} ${u}`,short:"primera vez",lastTxt:"",last:null};
  const W=Math.max(...last.sets.map(s=>s.w||0));
  const top=last.sets.filter(s=>(s.w||0)===W);
  if(top.length>=n&&top.every(s=>s.r>=hi)){
    if(lib.inc>0){const nw=Math.round((W+lib.inc)*4)/4;
      return {kind:"up",w:nw,reps:Array(n).fill(lo),text:std?`Llegaste a ${hi} en todas: subí a ${fmtKg(nw)} kg`:`Llegaste a ${hi} ${u}: subí ${u0} a ${fmtKg(nw)}`,short:std?`hoy ${fmtKg(nw)} kg`:`hoy ${u0} ${fmtKg(nw)}`,lastTxt:lastTxt(last),last}}
    return {kind:"up",w:W,reps:Array(n).fill(hi),text:std?`Ya hacés ${hi} reps: sumá lastre o pasá a una variante más difícil`:`Ya llegás a ${hi} ${u}: probá una variante más difícil o sumá peso`,short:"subí la dificultad",lastTxt:lastTxt(last),last}}
  if(top.some(s=>s.r<lo))return {kind:"hold",w:W,reps:Array(n).fill(lo),text:std?`Mantené ${fmtKg(W)} kg y buscá ${lo} reps en todas`:`Buscá llegar a ${lo} ${u} en todas`,short:std?`hoy mantené ${fmtKg(W)} kg`:`hoy ${lo} ${u}`,lastTxt:lastTxt(last),last};
  const reps=Array.from({length:n},(_,i)=>Math.min(hi,(top[i]?top[i].r:lo)+st));
  return {kind:"same",w:W,reps,text:std?`Mismo peso: sumá 1 rep por serie (hasta ${hi})`:`Sumá ${st} ${u} por serie (hasta ${hi})`,short:std?`hoy ${fmtKg(W)} kg, +1 rep`:`hoy +${st} ${u}`,lastTxt:lastTxt(last),last};
}
function bestWeight(exId){if(!isStd(exId))return null;let b=null;for(const s of state.sessions)for(const e of s.entries)if(e.id===exId)for(const x of e.sets)if(b===null||x.w>b)b=x.w;return b}

// ---------- Render ----------
function render(){
  const app=$("#app");
  if(state.draft&&state.inWorkout)app.innerHTML=viewWorkout();
  else if(state.tab==="train")app.innerHTML=viewHome();
  else if(state.tab==="hist")app.innerHTML=viewHistory();
  else app.innerHTML=viewPlan();
  renderTabs();renderRest();renderSheet();
}
function renderTabs(){
  const t=$("#tabs");
  if(state.draft&&state.inWorkout){t.hidden=true;return}
  t.hidden=false;
  const b=(k,label,svg)=>`<button data-act="tab" data-k="${k}" class="${state.tab===k?"on":""}">${svg}${label}</button>`;
  t.innerHTML=`<div class="in">${
    b("train","Entrenar",'<svg viewBox="0 0 24 24"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>')}${
    b("hist","Historial",'<svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>')}${
    b("plan","Rutina",'<svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>')}</div>`;
}

function pushNav(v){try{history.pushState({v},"")}catch(e){}}
function enterWorkout(){state.inWorkout=true;pushNav("w");render();window.scrollTo(0,0);wake()}
function leaveWorkout(){if(history.state&&history.state.v==="w")history.back();else{state.inWorkout=false;state.confirmFinish=false;render();window.scrollTo(0,0)}}
function openSheet(sh){state.sheet=sh;pushNav("s");renderSheet()}
function closeSheet(){if(history.state&&history.state.v==="s")history.back();else{state.sheet=null;renderSheet()}}
window.addEventListener("popstate",()=>{
  if(state.sheet){state.sheet=null;renderSheet();return}
  if(state.inWorkout){state.inWorkout=false;state.confirmFinish=false;render();window.scrollTo(0,0)}
});
function nextDay(){
  const days=state.plan.days;if(!days.length)return null;
  const last=state.sessions[0];if(!last)return days[0];
  const i=days.findIndex(d=>d.id===last.dayId);
  return days[(i+1)%days.length]||days[0];
}
function viewHome(){
  const days=state.plan.days, nd=nextDay();
  const now=new Date(), wkStart=new Date(now);wkStart.setDate(now.getDate()-((now.getDay()+6)%7));wkStart.setHours(0,0,0,0);
  const thisWeek=state.sessions.filter(s=>new Date(s.date)>=wkStart).length;
  const last=state.sessions[0];
  const lastDays=last?Math.floor((Date.now()-new Date(last.date))/864e5):null;
  const lastDone=id=>{const s=state.sessions.find(s=>s.dayId===id);return s?fmtDate(s.date):"Nunca"};
  return `
  <div class="top"><div><div class="eyebrow">${esc(new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"}))}</div><h1>Libreta de gym</h1></div>${syncHTML()}</div>
  <div class="stats">
    <div class="stat"><b class="num">${thisWeek}</b><span>entrenos esta semana</span></div>
    <div class="stat"><b class="num">${state.sessions.length}</b><span>entrenos en total</span></div>
    <div class="stat"><b class="num">${lastDays===null?"–":lastDays===0?"Hoy":lastDays}</b><span>${lastDays===null||lastDays===0?"último entreno":"días desde el último"}</span></div>
  </div>
  ${state.draft?(()=>{const D=state.draft;const dn=D.ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0),tt=D.ex.reduce((a,e)=>a+e.sets.length,0);
    return `<section class="hero live" style="margin-top:12px"><div class="eyebrow">Entreno en curso</div><h2>${esc(D.dayName)}</h2><div class="note num">${dn} de ${tt} series hechas · empezaste hace ${fmtTime((Date.now()-new Date(D.startedAt))/1000)}</div><button class="btn primary full" data-act="resume">Continuar entreno</button></section>`})():""}
  ${!state.plan.goal?`<section class="hero" style="margin-top:12px"><div><div class="eyebrow">Primero lo primero</div><h2>¿Cuál es tu meta?</h2></div><div class="note">Arma tu rutina con los ejercicios, series, reps y descansos que corresponden. Lo podés cambiar cuando quieras en Rutina.</div>
    <div class="goals">${Object.entries(GOALS).map(([k,g])=>`<button class="goal" data-act="goal-yes" data-k="${k}"><b>${g.n}</b><span>${esc(g.d)}</span></button>`).join("")}</div></section>`:""}
  ${nd&&!state.draft?(()=>{const cw=cycleWeek();return `<section class="hero" style="margin-top:12px">
    <div class="row between" style="align-items:flex-start"><div><div class="eyebrow">Hoy toca · ${esc(state.plan.name||"Tu rutina")} · ${esc(GOALS[goalOf()].n)}</div><h2>${esc(dayLabel(nd))}</h2></div><button class="btn sm ghost" data-act="tab" data-k="plan">Cambiar</button></div>
    ${cw||varyWeek()?`<div class="row" style="flex-wrap:wrap;gap:6px">${cw?`<span class="chip est">Semana ${cw.i+1} de ${cw.total} · ${esc(cw.n||"")} · ${cw.lo}–${cw.hi} reps</span>`:""}${varyWeek()?`<span class="chip new">Ejercicios: variante ${varyWeek().letter} de ${varyWeek().n}</span>`:""}</div>`:""}
    <ul class="exlist">${resolveDay(nd).map(e=>{const p=rx(e);const g=suggest(e.id,e.sets,p.lo,p.hi,cw&&isStd(e.id)?cw.id:null);
      return `<li><button class="row grow" data-act="info" data-id="${e.id}" style="text-align:left;align-items:center">${thumb(e.id,"sm")}<span class="grow"><span style="display:block;font-weight:600">${esc(exName(e.id))}</span><span class="sg ${g.kind} num">${esc(g.lastTxt)}${esc(g.short)}</span></span></button><span class="sx num">${e.sets} × ${p.lo}${p.hi!==p.lo?"–"+p.hi:""}${isStd(e.id)?"":" "+COLS(e.id)[1]}</span></li>`}).join("")}</ul>
    <button class="btn primary full" data-act="start" data-id="${nd.id}">Empezar ${esc(dayLabel(nd))}</button>
  </section>`})():(!nd?`<p class="muted">No tenés días en la rutina. Armá uno en la pestaña Rutina.</p>`:"")}
  ${state.draft?"":`<div style="margin-top:22px" class="eyebrow">Otro día</div>
  <div>${days.filter(d=>d!==nd).map(d=>`<div class="daycard"><div class="grow"><h3>${esc(dayLabel(d))}</h3><div class="note">${d.ex.length} ejercicios · último: ${lastDone(d.id)}</div></div><button class="btn sm" data-act="start" data-id="${d.id}">Empezar</button></div>`).join("")}</div>`}
  <p class="note" style="margin-top:18px">Versión 9 oct · variantes. Fotos: free-exercise-db (dominio público). Usala siempre desde el ícono de la pantalla de inicio: ahí quedan guardados tus datos.</p>`;
}

function startWorkout(dayId){
  const day=state.plan.days.find(d=>d.id===dayId);if(!day)return;
  const cw=cycleWeek();
  state.draft={dayId,dayName:dayLabel(day),cyc:cw?cw.id:null,cycName:cw?`Semana ${cw.i+1} · ${cw.n||""} ${cw.lo}–${cw.hi}`:null,startedAt:new Date().toISOString(),vary:varyWeek()?varyWeek().letter:null,ex:resolveDay(day).map(e=>{
    const p=rx(e);const ph=cw&&isStd(e.id)?cw.id:null;
    const sg=suggest(e.id,e.sets,p.lo,p.hi,ph);
    return {id:e.id,lo:p.lo,hi:p.hi,rest:p.rest,sug:{kind:sg.kind,text:sg.text},prev:sg.last?sg.last.sets:null,
      sets:Array.from({length:e.sets},(_,i)=>({w:sg.w===""?"":String(sg.w).replace(".",","),r:String(sg.reps[i]),done:false}))};
  })};
  state.confirmFinish=false;
  saveDraftNow();enterWorkout();
}
function viewWorkout(){
  const d=state.draft;
  const done=d.ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0), total=d.ex.reduce((a,e)=>a+e.sets.length,0);
  return `
  <div class="wbar"><button class="icon" data-act="wback" aria-label="Volver al inicio">${ICON.back}</button><div class="grow"><div class="eyebrow"><span id="elapsed" class="num">${fmtTime((Date.now()-new Date(d.startedAt))/1000)}</span> · ${done}/${total} series${d.cycName?` · ${esc(d.cycName)}`:""}</div><h2>${esc(d.dayName)}</h2></div>
  <button class="btn sm ${state.confirmFinish?"":"primary"}" data-act="finish">Terminar</button></div>
  ${state.confirmFinish?`<div class="confirm" style="margin-top:12px"><b>¿Terminar el entrenamiento?</b><span class="note">Se guardan solo las series marcadas con ✓ (${done}).</span>
    <div class="row"><button class="btn primary grow" data-act="save">Guardar</button><button class="btn grow" data-act="keep">Seguir</button></div>
    <button class="btn danger sm" data-act="discard">Descartar sin guardar</button></div>`:""}
  <div class="stack" style="margin-top:12px">
  ${d.ex.map((e,ei)=>{
    const lib=LIB[e.id]||{};const [c0,c1]=COLS(e.id);const rest=e.rest??lib.rest??90;
    const complete=e.sets.length&&e.sets.every(s=>s.done);
    return `<section class="excard ${complete?"complete":""}">
      <button class="exhead" data-act="info" data-id="${e.id}">${thumb(e.id)}<div class="grow"><h3>${esc(exName(e.id))}</h3><div class="info">${e.sets.length} × ${e.lo}${e.hi!==e.lo?"–"+e.hi:""} ${c1}${rest?` · descanso ${fmtTime(rest)}`:""} · ver técnica</div></div></button>
      <div><span class="chip ${e.sug.kind}">${esc(e.sug.text)}</span></div>
      <div class="sets">
        <span></span><span class="h" style="text-align:center">${esc(c0)}</span><span class="h" style="text-align:center">${esc(c1)}</span><span></span>
        ${e.sets.map((s,si)=>`
          <span class="idx">${si+1}</span>
          <span class="${s.done?"done":""}"><input id="w-${ei}-${si}" data-f="w" data-e="${ei}" data-s="${si}" inputmode="decimal" placeholder="${esc(c0)}" value="${esc(s.w)}" aria-label="Peso serie ${si+1}"></span>
          <span class="${s.done?"done":""}"><input id="r-${ei}-${si}" data-f="r" data-e="${ei}" data-s="${si}" inputmode="numeric" placeholder="${esc(c1)}" value="${esc(s.r)}" aria-label="Repeticiones serie ${si+1}"></span>
          <button class="check ${s.done?"on":""}" data-act="toggle" data-e="${ei}" data-s="${si}" aria-label="Serie ${si+1} hecha">${ICON.check}</button>
          ${e.prev&&e.prev[si]?`<span></span><span class="prev num">Anterior: ${esc(isStd(e.id)?`${fmtKg(e.prev[si].w)} kg × ${e.prev[si].r}`:fmtSet(e.id,e.prev[si]))}</span><span></span><span></span>`:""}
        `).join("")}
      </div>
      <div class="row"><button class="btn sm ghost" data-act="addset" data-e="${ei}">+ Serie</button>${e.sets.length>1?`<button class="btn sm ghost muted" data-act="rmset" data-e="${ei}">– Serie</button>`:""}</div>
    </section>`}).join("")}
  </div>`;
}

function finishWorkout(){
  const d=state.draft;
  const entries=d.ex.map(e=>({id:e.id,sets:e.sets.filter(s=>s.done).map(s=>({w:num(s.w)??0,r:Math.round(num(s.r)??0)})).filter(s=>s.r>0)})).filter(e=>e.sets.length);
  if(!entries.length){discardWorkout();toast("No había series marcadas, no se guardó nada");return}
  let prs=0;for(const e of entries){if(!isStd(e.id))continue;const b=bestWeight(e.id);const top=Math.max(...e.sets.map(s=>s.w));if(b!==null&&top>b)prs++}
  const s={id:uid("s"),date:new Date().toISOString(),dayId:d.dayId,dayName:d.dayName,cyc:d.cyc||null,min:Math.round((Date.now()-new Date(d.startedAt))/60000),entries};
  state.sessions.unshift(s);sortSessions();
  state.draft=null;state.rest=null;state.confirmFinish=false;state.inWorkout=false;
  try{if(history.state&&history.state.v==="w")history.replaceState({v:"home"},"")}catch(e){}
  writeSession(s);writeDraft(null);
  const vol=entries.reduce((a,e)=>a+(isStd(e.id)?e.sets.reduce((b,x)=>b+x.w*x.r,0):0),0);
  const sets=entries.reduce((a,e)=>a+e.sets.length,0);
  state.tab="train";render();window.scrollTo(0,0);
  toast(`Guardado: ${sets} series · ${Math.round(vol).toLocaleString("es-AR")} kg de volumen${prs?` · ${prs} récord${prs>1?"s":""} de peso`:""}`);
}
function discardWorkout(){state.draft=null;state.rest=null;state.confirmFinish=false;state.inWorkout=false;try{if(history.state&&history.state.v==="w")history.replaceState({v:"home"},"")}catch(e){}writeDraft(null);render()}

// ---------- Timer de descanso ----------
let audioCtx=null, beeped=false;
function startRest(sec){state.rest={end:Date.now()+sec*1000,total:sec};beeped=false;renderRest()}
function renderRest(){
  const el=$("#rest");
  if(!state.rest||!state.draft||!state.inWorkout){el.innerHTML="";return}
  const left=(state.rest.end-Date.now())/1000;
  const over=left<=0;
  if(over&&!beeped){beeped=true;beep()}
  const pct=Math.max(0,Math.min(100,left/state.rest.total*100));
  el.innerHTML=`<div class="rest ${over?"over":""}" style="bottom:calc(12px + env(safe-area-inset-bottom,0px))"><div class="in">
    <div><div class="eyebrow">${over?"A la próxima serie":"Descanso"}</div><div class="t">${over?"+"+fmtTime(-left):fmtTime(left)}</div></div>
    <div class="grow"></div>
    ${over?"":`<button class="btn sm" data-act="rest-add">+15 s</button>`}
    <button class="btn sm ${over?"primary":""}" data-act="rest-stop">${over?"Listo":"Saltar"}</button>
    <div class="bar" style="width:${pct}%"></div></div></div>`;
}
function beep(){
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  try{if(!audioCtx)return;const t=audioCtx.currentTime;[0,0.25,0.5].forEach(o=>{const g=audioCtx.createGain(),osc=audioCtx.createOscillator();osc.frequency.value=880;g.gain.setValueAtTime(0.0001,t+o);g.gain.exponentialRampToValueAtTime(0.4,t+o+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+o+0.18);osc.connect(g).connect(audioCtx.destination);osc.start(t+o);osc.stop(t+o+0.2)})}catch(e){}
}
function unlockAudio(){try{if(!audioCtx){const A=window.AudioContext||window.webkitAudioContext;if(A)audioCtx=new A()}if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume()}catch(e){}}
setInterval(()=>{
  if(state.rest&&state.draft)renderRest();
  const el=$("#elapsed");if(el&&state.draft)el.textContent=fmtTime((Date.now()-new Date(state.draft.startedAt))/1000);
},1000);
let wakeLock=null;
async function wake(){try{if(navigator.wakeLock&&state.draft&&!wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>{wakeLock=null})}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake()});

// ---------- Ficha del ejercicio ----------
function historyFor(exId){
  const std=isStd(exId);const out=[];for(const s of state.sessions){const e=s.entries.find(e=>e.id===exId);if(e)out.push({date:s.date,sets:e.sets,top:Math.max(...e.sets.map(x=>std?x.w:x.r))})}
  return out;
}
function chartSVG(points){
  if(points.length<2)return `<p class="note">El gráfico aparece cuando tengas al menos dos entrenamientos con este ejercicio.</p>`;
  const W=320,H=150,pl=36,pr=40,pt=14,pb=24;
  const ys=points.map(p=>p.top);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=2.5;mx+=2.5}
  const x=i=>pl+i*(W-pl-pr)/(points.length-1), y=v=>pt+(mx-v)*(H-pt-pb)/(mx-mn);
  const line=points.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(p.top).toFixed(1)}`).join(" ");
  const area=line+` L${x(points.length-1).toFixed(1)} ${H-pb} L${pl} ${H-pb} Z`;
  const last=points[points.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Peso de la mejor serie por entrenamiento">
    <line x1="${pl}" x2="${W-pr}" y1="${y(mx)}" y2="${y(mx)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <line x1="${pl}" x2="${W-pr}" y1="${y(mn)}" y2="${y(mn)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <text x="${pl-6}" y="${y(mx)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtKg(mx)}</text>
    <text x="${pl-6}" y="${y(mn)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtKg(mn)}</text>
    <path d="${area}" fill="var(--accent)" fill-opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.top)}" r="${i===points.length-1?5:2.5}" fill="${i===points.length-1?"var(--accent)":"var(--bg)"}" stroke="var(--accent)" stroke-width="2"/>`).join("")}
    <text x="${x(points.length-1)+8}" y="${y(last.top)+4}" font-size="12" font-weight="700" fill="var(--fg)">${fmtKg(last.top)}</text>
    <text x="${pl}" y="${H-6}" font-size="11" fill="var(--muted)">${esc(new Date(points[0].date).toLocaleDateString("es-AR",{day:"numeric",month:"short"}))}</text>
    <text x="${W-pr}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(new Date(last.date).toLocaleDateString("es-AR",{day:"numeric",month:"short"}))}</text>
  </svg>`;
}

function animateFig(id){
  const my=++animId,t0=performance.now(),CY=3600;

    if(my!==animId)return;const box=document.getElementById("figanim");if(!box)return;

    if(p<.38){k=ease(p/.38);ph="Inicio → final"}else if(p<.5){k=1;ph="Final"}else if(p<.88){k=1-ease((p-.5)/.38);ph="Volvé controlado"}else{k=0;ph="Inicio"}
    box.innerHTML=figSVG(id,k,FIGC);const lb=document.getElementById("figphase");if(lb&&lb.textContent!==ph)lb.textContent=ph;
    requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

    case "cyc-prev":case "cyc-next":{const d=new Date(state.cycle.start);d.setDate(d.getDate()+(a==="cyc-next"?-7:7));state.cycle.start=d.toISOString();saveCycle();render();break}

    case "discard":discardWorkout();break;
    case "export":exportBackup();break;
    case "import-yes":{const d=state.importData;state.plan=d.plan;state.sessions=d.sessions;if(d.cycle!==undefined){state.cycle=d.cycle;saveCycle()}if(d.vary!==undefined){state.vary=d.vary;saveVary()}sortSessions();state.importData=null;lsSet("gym.plan",state.plan);lsSet("gym.sessions",state.sessions);render();toast(`Copia importada: ${state.sessions.length} entrenamientos`);break}
    case "import-no":state.importData=null;render();break;
    case "photo-pause":photoPlay(!photoTimer);break;
    case "photo-show":photoPlay(false);photoShow(+t.dataset.i);break;
    case "rest-add":if(state.rest){state.rest.end+=15000;state.rest.total+=15;renderRest()}break;
    case "rest-stop":state.rest=null;renderRest();break;
    case "info":openSheet({type:"info",id:t.dataset.id});break;
    case "close":case "backdrop":closeSheet();break;
    case "addex":openSheet({type:"pick",day:t.dataset.day});break;
    case "pickex":{const d=dayById(t.dataset.day),id=t.dataset.id,L=LIB[id]||{};
      d.ex.push(L.cardio?{id,sets:1,lo:20,hi:30,rest:0}:L.cols?{id,sets:3,lo:30,hi:45}:MAIN.has(id)?{id,sets:3,lo:6,hi:8}:{id,sets:3,lo:10,hi:12});closeSheet();savePlanNow();render();break}
    case "exup":case "exdown":{const d=dayById(t.dataset.day),i=+t.dataset.i,j=a==="exup"?i-1:i+1;if(j<0||j>=d.ex.length)break;[d.ex[i],d.ex[j]]=[d.ex[j],d.ex[i]];savePlanNow();render();break}
    case "exrm":{const d=dayById(t.dataset.day);d.ex.splice(+t.dataset.i,1);savePlanNow();render();break}
    case "dayup":{const i=+t.dataset.i;if(i>0){const ds=state.plan.days;[ds[i],ds[i-1]]=[ds[i-1],ds[i]];savePlanNow();render()}break}
    case "addday":state.plan.days.push({id:uid("d"),name:"Día "+(state.plan.days.length+1),ex:[]});savePlanNow();render();break;
    case "delday":state.confirmDel=t.dataset.day;render();break;
    case "delday-yes":state.plan.days=state.plan.days.filter(d=>d.id!==t.dataset.day);state.confirmDel=null;savePlanNow();render();break;
    case "delsess":state.confirmDel=t.dataset.id;render();break;
    case "delsess-no":state.confirmDel=null;render();break;
    case "delsess-yes":{const id=t.dataset.id;state.sessions=state.sessions.filter(s=>s.id!==id);state.confirmDel=null;removeSession(id);render();break}
    case "chooseplan":state.confirmPlan=state.confirmPlan===t.dataset.k?null:t.dataset.k;render();break;
    case "plan-no":state.confirmPlan=null;render();break;
    case "plan-yes":state.plan=buildPlan(t.dataset.k,state.plan.goal);state.confirmPlan=null;savePlanNow();render();toast(`Plan cambiado: ${state.plan.name}`);break;
  }
});
document.addEventListener("input",ev=>{
  const t=ev.target,f=t.dataset.f;if(!f)return;
  if((f==="w"||f==="r")&&state.draft){const ei=+t.dataset.e,si=+t.dataset.s,sets=state.draft.ex[ei].sets,old=sets[si][f];sets[si][f]=t.value;
    for(let j=si+1;j<sets.length;j++){const x=sets[j];if(x.done||(x[f]!==""&&x[f]!==old))break;x[f]=t.value;const el=document.getElementById(f+"-"+ei+"-"+j);if(el)el.value=t.value}
    saveDraftSoon();return}
  if(f==="dayname"){dayById(t.dataset.day).name=t.value;savePlanSoon();return}
  if(f==="psets"||f==="plo"||f==="phi"){
    const v=Math.round(num(t.value));if(!v||v<1||v>300)return;
    const e=dayById(t.dataset.day).ex[+t.dataset.i];
    if(f==="psets")e.sets=v;if(f==="plo")e.lo=v;if(f==="phi")e.hi=v;
    if(e.hi<e.lo&&f!=="psets"){ if(f==="plo")e.hi=e.lo; }
    savePlanSoon();
  }
  if(f==="cname"&&state.cycle){state.cycle.weeks[+t.dataset.i].n=t.value;saveCycle();return}
  if((f==="clo"||f==="chi")&&state.cycle){const v=Math.round(num(t.value));if(!v||v<1||v>100)return;const w=state.cycle.weeks[+t.dataset.i];if(f==="clo")w.lo=v;else w.hi=v;if(w.hi<w.lo&&f==="clo")w.hi=w.lo;saveCycle()}
});
document.addEventListener("focusin",ev=>{const t=ev.target;if(t.tagName==="INPUT"&&t.dataset.f&&t.dataset.f!=="dayname")setTimeout(()=>{try{t.select()}catch(e){}},0)});
document.addEventListener("change",ev=>{const f=ev.target.dataset.f;if(f==="plo"||f==="phi"||f==="psets"){const e=dayById(ev.target.dataset.day)?.ex[+ev.target.dataset.i];if(e&&e.hi<e.lo){e.hi=e.lo;savePlanNow();render()}}});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&state.sheet)closeSheet()});
document.addEventListener("change",ev=>{if(ev.target.id==="vary-keep"&&state.vary){state.vary.keepMain=ev.target.checked;saveVary();render()}});
document.addEventListener("change",ev=>{const f=ev.target.dataset.f;if((f==="clo"||f==="chi")&&state.cycle){const w=state.cycle.weeks[+ev.target.dataset.i];if(w.hi<w.lo)w.hi=w.lo;saveCycle();render()}});

async function exportBackup(){
  const data=JSON.stringify({app:"libreta-gym",version:2,exportedAt:new Date().toISOString(),plan:state.plan,sessions:state.sessions,cycle:state.cycle||null,vary:state.vary||null},null,1);
  const name=`gym-copia-${new Date().toISOString().slice(0,10)}.json`;
  try{const f=new File([data],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Copia Libreta de gym"});return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
document.addEventListener("change",async ev=>{if(ev.target.id!=="importfile")return;const f=ev.target.files&&ev.target.files[0];ev.target.value="";if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d||!d.plan||!Array.isArray(d.plan.days)||!Array.isArray(d.sessions))throw 0;state.importData=d;render()}catch(e){toast("Ese archivo no es una copia de la Libreta de gym")}});
let toastT=null;
function toast(msg){const el=$("#toast");el.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>el.innerHTML="",4000)}

// ---------- Arranque ----------
sortSessions();
try{history.replaceState({v:"home"},"");if(state.draft){history.pushState({v:"w"},"")}}catch(e){}
render();
if(state.draft)wake();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{try{r.update()}catch(e){}}).catch(()=>{}));
</script>
